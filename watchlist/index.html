<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Watchlist</title>
  <meta name="description" content="Tap for a random film from my Letterboxd watchlist.">
  <meta name="theme-color" content="#5f0f40">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Watchlist">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <button id="stage" type="button" aria-label="Show a random film">
      <span class="frame">
        <span class="poster-box">
          <img id="poster" alt="" hidden>
          <span id="prompt" class="prompt">Tap</span>
        </span>
      </span>
      <span class="caption" aria-live="polite">
        <span id="title" class="title"></span>
        <span id="meta" class="meta"></span>
        <span id="why" class="why"></span>
      </span>
    </button>
    <div id="lens" class="lens" hidden>
      <span id="lens-text" class="lens-text"></span>
      <button id="lens-clear" type="button" class="lens-clear">Clear</button>
    </div>
    <nav class="bar" aria-label="Main">
      <button type="button" id="open-tonight">Tonight</button>
      <button type="button" id="open-film" disabled>This film</button>
      <button type="button" id="open-explore">Explore</button>
    </nav>
  </main>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <header class="sheet-head">
        <h2 id="sheet-title" tabindex="-1" autofocus></h2>
        <button type="button" id="sheet-close">Close</button>
      </header>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
